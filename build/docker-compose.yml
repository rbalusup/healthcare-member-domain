version: "3.9"

# Local development stack for the healthcare member service.
# Starts: PostgreSQL, Kafka (KRaft — no Zookeeper), Prometheus, Grafana.

services:

  # ──────────────────────────────
  # Member Service
  # ──────────────────────────────
  member-service:
    build:
      context: ..
      dockerfile: build/Dockerfile
    image: healthcare/member-service:local
    ports:
      - "9090:9090"   # gRPC
      - "8080:8080"   # HTTP / gRPC-gateway
      - "2112:2112"   # Prometheus metrics
    environment:
      MEMBER_DB_HOST: postgres
      MEMBER_DB_PORT: 5432
      MEMBER_DB_NAME: member_db
      MEMBER_DB_USER: member_user
      MEMBER_DB_PASSWORD: member_pass
      MEMBER_DB_SSL_MODE: disable
      MEMBER_KAFKA_BROKERS: kafka:9092
      MEMBER_KAFKA_GROUP_ID: member-service
      MEMBER_KAFKA_TRANSACTIONAL_ID: member-service-producer-1
      MEMBER_LOG_LEVEL: debug
      MEMBER_LOG_FORMAT: console
      APP_VERSION: local
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - member-net

  # ──────────────────────────────
  # PostgreSQL 16
  # ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: member_db
      POSTGRES_USER: member_user
      POSTGRES_PASSWORD: member_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U member_user -d member_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - member-net

  # ──────────────────────────────
  # Kafka (KRaft mode — no Zookeeper)
  # ──────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - member-net

  # ──────────────────────────────
  # Prometheus
  # ──────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9091:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    depends_on:
      - member-service
    networks:
      - member-net

  # ──────────────────────────────
  # Grafana
  # ──────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - member-net

volumes:
  postgres_data:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  member-net:
    driver: bridge

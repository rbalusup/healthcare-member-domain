name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  GO_VERSION: "1.22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/member-service

jobs:
  deploy-aws:
    name: Deploy to AWS (ECS Fargate)
    runs-on: ubuntu-latest
    environment: production-aws
    # Only deploy on main branch pushes or version tags
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VERSION=${{ github.sha }} \
            -f build/Dockerfile \
            -t $ECR_REGISTRY/member-service:$IMAGE_TAG \
            -t $ECR_REGISTRY/member-service:latest \
            .
          docker push $ECR_REGISTRY/member-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/member-service:latest
          echo "image=$ECR_REGISTRY/member-service:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/aws/task-definition.json
          container-name: member-service
          image: ${{ steps.login-ecr.outputs.registry }}/member-service:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: member-service
          cluster: healthcare-production
          wait-for-service-stability: true

  deploy-gcp:
    name: Deploy to GCP (GKE)
    runs-on: ubuntu-latest
    environment: production-gcp
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io

      - name: Build and push to GCR
        run: |
          docker build \
            --build-arg VERSION=${{ github.sha }} \
            -f build/Dockerfile \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/member-service:${{ github.sha }} \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/member-service:latest \
            .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/member-service:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/member-service:latest

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            ${{ secrets.GKE_CLUSTER }} \
            --region ${{ secrets.GKE_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to GKE
        run: |
          kubectl set image deployment/member-service \
            member-service=gcr.io/${{ secrets.GCP_PROJECT_ID }}/member-service:${{ github.sha }} \
            -n healthcare
          kubectl rollout status deployment/member-service -n healthcare --timeout=5m

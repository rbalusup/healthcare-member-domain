syntax = "proto3";

package healthcare.member.v1;

option go_package = "github.com/healthcare/member-service/gen/go/member/v1;memberv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

// MemberService manages the lifecycle of healthcare members (patients).
// It provides CRUD operations, enrollment management, and risk profiling.
service MemberService {
  // CreateMember creates a new member record in the system.
  rpc CreateMember(CreateMemberRequest) returns (Member) {
    option (google.api.http) = {
      post: "/api/v1/members"
      body: "*"
    };
  }

  // GetMember retrieves a member by their unique ID.
  rpc GetMember(GetMemberRequest) returns (Member) {
    option (google.api.http) = {
      get: "/api/v1/members/{member_id}"
    };
  }

  // UpdateMember updates a member's profile information.
  rpc UpdateMember(UpdateMemberRequest) returns (Member) {
    option (google.api.http) = {
      put: "/api/v1/members/{member_id}"
      body: "*"
    };
  }

  // ListMembers returns a paginated list of members with optional filtering.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (google.api.http) = {
      get: "/api/v1/members"
    };
  }

  // EnrollMember enrolls a member in a care plan.
  rpc EnrollMember(EnrollMemberRequest) returns (Member) {
    option (google.api.http) = {
      post: "/api/v1/members/{member_id}/enroll"
      body: "*"
    };
  }

  // GetMemberRiskProfile retrieves the clinical risk profile of a member.
  rpc GetMemberRiskProfile(GetMemberRiskProfileRequest) returns (RiskProfile) {
    option (google.api.http) = {
      get: "/api/v1/members/{member_id}/risk-profile"
    };
  }
}

// ──────────────────────────────────────────────
// Enumerations
// ──────────────────────────────────────────────

// MemberStatus represents the current enrollment/activity state of a member.
enum MemberStatus {
  MEMBER_STATUS_UNSPECIFIED = 0;
  MEMBER_STATUS_ACTIVE = 1;
  MEMBER_STATUS_INACTIVE = 2;
  MEMBER_STATUS_SUSPENDED = 3;
}

// Gender represents the member's gender identity.
enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
  GENDER_NON_BINARY = 3;
}

// CareLevel reflects the intensity of care required.
enum CareLevel {
  CARE_LEVEL_UNSPECIFIED = 0;
  CARE_LEVEL_STANDARD = 1;
  CARE_LEVEL_ENHANCED = 2;
  CARE_LEVEL_COMPLEX = 3;
}

// ──────────────────────────────────────────────
// Value objects
// ──────────────────────────────────────────────

// Address represents a physical mailing address.
message Address {
  string street  = 1;
  string city    = 2;
  string state   = 3;
  string zip_code = 4;
  string country = 5;
}

// ──────────────────────────────────────────────
// Core resource
// ──────────────────────────────────────────────

// Member represents a patient/member receiving care through the platform.
message Member {
  // Unique member identifier (UUID).
  string member_id = 1;

  // Demographics
  string first_name   = 2;
  string last_name    = 3;
  string email        = 4;
  string phone        = 5;
  google.protobuf.Timestamp date_of_birth = 6;
  Gender gender = 7;

  // Contact
  Address address = 8;

  // Enrollment
  string plan_id = 9;
  google.protobuf.Timestamp enrollment_date = 10;

  // Status
  MemberStatus status = 11;

  // Risk profile
  double risk_score = 12;
  string care_level = 13;

  // Audit timestamps
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

// RiskProfile is the read model for a member's clinical risk assessment.
message RiskProfile {
  string member_id = 1;
  double risk_score = 2;
  string care_level = 3;
  google.protobuf.Timestamp updated_at = 4;
}

// ──────────────────────────────────────────────
// Request / Response messages
// ──────────────────────────────────────────────

message CreateMemberRequest {
  string first_name   = 1 [(google.api.field_behavior) = REQUIRED];
  string last_name    = 2 [(google.api.field_behavior) = REQUIRED];
  string email        = 3 [(google.api.field_behavior) = REQUIRED];
  string phone        = 4;
  google.protobuf.Timestamp date_of_birth = 5 [(google.api.field_behavior) = REQUIRED];
  Gender gender = 6;
  Address address = 7;
  string plan_id = 8 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Timestamp enrollment_date = 9 [(google.api.field_behavior) = REQUIRED];
}

message GetMemberRequest {
  string member_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateMemberRequest {
  string member_id = 1 [(google.api.field_behavior) = REQUIRED];
  string first_name = 2;
  string last_name  = 3;
  string phone      = 4;
  Address address   = 5;
}

message ListMembersRequest {
  // Pagination
  int32 page      = 1; // 1-indexed; defaults to 1
  int32 page_size = 2; // defaults to 20, max 100

  // Filters
  string search_term  = 3; // matches name or email (case-insensitive)
  string plan_id      = 4;
  MemberStatus status = 5;
  CareLevel care_level = 6;
}

message ListMembersResponse {
  repeated Member members = 1;
  int64 total_count = 2;
  int32 page        = 3;
  int32 page_size   = 4;
}

message EnrollMemberRequest {
  string member_id = 1 [(google.api.field_behavior) = REQUIRED];
  string plan_id   = 2 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Timestamp enrollment_date = 3 [(google.api.field_behavior) = REQUIRED];
}

message GetMemberRiskProfileRequest {
  string member_id = 1 [(google.api.field_behavior) = REQUIRED];
}

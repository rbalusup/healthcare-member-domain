apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-service
  namespace: healthcare
  labels:
    app: member-service
    version: v1
    component: member-domain
spec:
  replicas: 3
  selector:
    matchLabels:
      app: member-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: member-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: member-service-sa
      terminationGracePeriodSeconds: 60
      containers:
        - name: member-service
          image: gcr.io/PROJECT_ID/member-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9090
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 2112
              protocol: TCP
          env:
            - name: MEMBER_LOG_LEVEL
              value: "info"
            - name: MEMBER_LOG_FORMAT
              value: "json"
            - name: MEMBER_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: member-service-db-secret
                  key: host
            - name: MEMBER_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: member-service-db-secret
                  key: port
            - name: MEMBER_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: member-service-db-secret
                  key: name
            - name: MEMBER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: member-service-db-secret
                  key: user
            - name: MEMBER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: member-service-db-secret
                  key: password
            - name: MEMBER_KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: member-service-kafka-secret
                  key: brokers
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Allow in-flight requests to drain before SIGTERM
                command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: member-service
  namespace: healthcare
  labels:
    app: member-service
spec:
  type: ClusterIP
  selector:
    app: member-service
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 2112
      targetPort: metrics
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: member-service-hpa
  namespace: healthcare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: member-service
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
